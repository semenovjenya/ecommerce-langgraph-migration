[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ecom-commerce-agent"
version = "0.1.0"
description = "LangGraph orchestration runtime for AI-ECOM"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx==0.28.1",
  "langchain==1.3.14",
  "langchain-core==1.5.1",
  "langchain-openai==1.4.0",
  "langfuse==4.14.0",
  "langgraph==1.2.9",
  "langgraph-checkpoint-postgres==3.1.0",
  "langsmith==0.10.10",
  "psycopg[binary,pool]==3.3.4",
  "pydantic==2.13.4",
  "starlette==1.3.1",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
research = ["deepagents==0.6.12"]

[dependency-groups]
dev = [
  "langgraph-cli[inmem]==0.4.31",
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
commerce_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
